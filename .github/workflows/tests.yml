name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with Django integration
        run: python -m pip install ".[django]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          printf 'Кнопка Sale\n' > /tmp/sample.txt
          fz168 check /tmp/sample.txt --surface public_information --format json --fail-on never > /tmp/report.json
          python - <<'PY'
          import json
          with open("/tmp/report.json", encoding="utf-8") as stream:
              report = json.load(stream)
          assert report["has_likely_violation"]
          assert any(item["code"] == "public-info-not-russian" for item in report["findings"])
          PY
