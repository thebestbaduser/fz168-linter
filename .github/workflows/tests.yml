name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          printf 'Кнопка Sale\n' > /tmp/sample.txt
          python -m fz168_linter.cli check /tmp/sample.txt --surface public_information || true
        env:
          PYTHONPATH: src
