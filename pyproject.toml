[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fz168-linter"
version = "0.1.0"
description = "Предварительная проверка текстов и интерфейсов на языковые риски по 168-ФЗ: кириллица в названиях ЖК, равнозначное дублирование, заимствования"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "thebestbaduser" }]
keywords = [
  "fz168",
  "russian-language",
  "linter",
  "compliance",
  "real-estate",
  "django",
  "llm",
  "claude-skill",
  "cursor-rules",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
morph = ["pymorphy3>=2.0", "pymorphy3-dicts-ru"]
django = ["django>=4.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
fz168 = "fz168_linter.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fz168_linter = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py39"
